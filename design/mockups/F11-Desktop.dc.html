<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
.pp{--bg:#FFFFFF;--surface:#F6F8F7;--card:#FFFFFF;--muted:#F2F5F3;--line:#E1E8E4;--line2:#CFD8D3;--text:#14201A;--text2:#5B6B62;--brand:#17734A;--on-brand:#FFFFFF;--inv:#14201A;--on-inv:#FFFFFF;--scrim:rgba(20,32,26,0.55);--soya-bg:#E3F1E9;--soya:#17734A;--paneer-bg:#FDF1DC;--paneer:#8A5208;--pulses-bg:#FDE7DF;--pulses:#A63D1A;--tofu-bg:#E6EEF8;--tofu:#24508F;--tempeh-bg:#EFE8F8;--tempeh:#5E3592;--whey-bg:#DFF3F1;--whey:#0D6B64;--warn-bg:#FDF1DC;--warn:#8A5208;--err-bg:#FDE7DF;--err:#A63D1A;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif}
.pp.dark{--bg:#111614;--surface:#0C100E;--card:#18201C;--muted:#1F2824;--line:#26312C;--line2:#3A4741;--text:#EEF3F0;--text2:#A3B2AA;--brand:#4CC487;--on-brand:#0C100E;--inv:#EEF3F0;--on-inv:#111614;--scrim:rgba(0,0,0,0.6);--soya-bg:#17301F;--soya:#7BD3A0;--paneer-bg:#33270F;--paneer:#F2C26B;--pulses-bg:#3A1E14;--pulses:#F29A78;--tofu-bg:#172438;--tofu:#8DB4EA;--tempeh-bg:#271C38;--tempeh:#C3A3EE;--whey-bg:#10302D;--whey:#6FD3C8;--warn-bg:#33270F;--warn:#F2C26B;--err-bg:#3A1E14;--err:#F29A78}
.num{font-family:'Space Grotesk',sans-serif}
</style>
</helmet>
<div class="pp {{themeClass}}" style="width: 1280px; height: 900px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column">
<div style="border-bottom: 1px solid var(--line)">
<div style="max-width: 1200px; margin: 0 auto; padding: 16px 40px; display: flex; align-items: center; gap: 12px">
<div class="num" style="font-size: 26px; font-weight: 700; letter-spacing: -0.6px; width: 228px">protein<span style="color: var(--brand)">/</span>plate</div>
<label style="flex: 1; max-width: 560px; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 14px; background: var(--muted); color: var(--text2); font-size: 15px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<input placeholder="Search a dish or ingredient" style="border: none; background: transparent; font: inherit; color: var(--text); flex: 1; min-width: 0; outline: none">
</label>
<div style="flex: 1"></div>
<a href="F5-MyRecipes.dc.html" style="height: 44px; padding: 0 14px; border-radius: 12px; color: var(--text); text-decoration: none; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>My recipes</a>
<a href="R5-Menu.dc.html" aria-label="Menu" style="width: 44px; height: 44px; border-radius: 12px; background: var(--muted); color: var(--text); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></a>
<a href="R5-Add.dc.html" style="height: 44px; padding: 0 16px; border-radius: 12px; background: var(--brand); color: var(--on-brand); text-decoration: none; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add recipes</a>
</div>
</div>
<div style="flex: 1; min-height: 0; max-width: 1200px; width: 100%; margin: 0 auto; padding: 0 40px; box-sizing: border-box; display: flex; gap: 32px">
<div style="width: 228px; flex: none; padding-top: 22px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 16px; font-weight: 800">Filters</span><button style="height: 32px; padding: 0; border: none; background: transparent; color: var(--brand); font: inherit; font-size: 13px; font-weight: 700">Clear all</button></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: 0.4px">MAIN PROTEIN</div>
<sc-for list="{{proteins}}" as="p" hint-placeholder-count="6">
<label style="display: flex; align-items: center; gap: 10px; min-height: 30px; font-size: 14px; opacity: {{p.op}}"><input type="checkbox" checked="{{p.on}}" disabled="{{p.off}}" style="width: 18px; height: 18px; accent-color: var(--brand)"><span style="width: 12px; height: 12px; border-radius: 6px; background: var(--{{p.k}})"></span><span style="flex: 1">{{p.label}}</span><span style="font-size: 12px; color: var(--text2)">{{p.n}}</span></label>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: 0.4px">DISH TYPE</div>
<sc-for list="{{types}}" as="t" hint-placeholder-count="5">
<label style="display: flex; align-items: center; gap: 10px; min-height: 30px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: var(--brand)"><span style="flex: 1">{{t.label}}</span><span style="font-size: 12px; color: var(--text2)">{{t.n}}</span></label>
</sc-for>
<button style="align-self: flex-start; height: 28px; padding: 0; border: none; background: transparent; color: var(--brand); font: inherit; font-size: 13px; font-weight: 700">Show all 13</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: 0.4px">SORT</div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 30px; font-size: 14px"><input type="radio" name="s" checked="{{ true }}" style="width: 18px; height: 18px; accent-color: var(--brand)">Protein, high to low</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 30px; font-size: 14px"><input type="radio" name="s" style="width: 18px; height: 18px; accent-color: var(--brand)">Calories, low to high</label>
</div>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding-top: 10px">
<div style="display: flex; gap: 26px; border-bottom: 1px solid var(--line)">
<sc-for list="{{meals}}" as="m" hint-placeholder-count="5"><button style="height: 46px; padding: 0; border: none; border-bottom: 2.5px solid {{m.bar}}; margin-bottom: -1px; background: transparent; color: {{m.color}}; font: inherit; font-size: 15px; font-weight: {{m.weight}}">{{m.label}}</button></sc-for>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="4"><button style="height: 34px; padding: 0 12px; border-radius: 8px; border: none; background: {{q.bg}}; color: {{q.fg}}; font: inherit; font-size: 13px; font-weight: 600">{{q.label}}</button></sc-for>
<div style="flex: 1"></div>
<span style="font-size: 13px; color: var(--text2); font-weight: 600">Dinner · Paneer or Soya — <b style="color: var(--text)">18 dishes</b></span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{recipes}}" as="r" hint-placeholder-count="8">
<a href="F12-DesktopRecipe.dc.html" style="text-decoration: none; color: var(--text); height: 176px; border-radius: 20px; background: var(--{{r.k}}-bg); padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: flex-start; color: var(--{{r.k}})">
<div style="display: flex; align-items: baseline; gap: 3px"><span class="num" style="font-size: 36px; font-weight: 700; line-height: 1; letter-spacing: -1px">{{r.p}}</span><span style="font-size: 13px; font-weight: 700">g</span></div>
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"/></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 15px; font-weight: 800; line-height: 1.2">{{r.name}}</div>
<div style="font-size: 12px; font-weight: 600; color: var(--{{r.k}})">{{r.meta}}</div>
<sc-if value="{{r.versions}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; margin-top: 2px; font-size: 11px; font-weight: 700; background: var(--{{r.k}}); color: var(--{{r.k}}-bg); border-radius: 6px; padding: 2px 7px">{{r.versions}}</span></sc-if>
</div>
</a>
</sc-for>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const I = { bowl: 'M4 12h16a8 8 0 0 1-16 0zM8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4', skew: 'M3 21L21 3M6.5 15a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M12 9.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0', noodle: 'M4 12h16a8 8 0 0 1-16 0zM9 12V4M13 12V3', salad: 'M4 12h16a8 8 0 0 1-16 0zM9 12c0-3 1-5 3-6M15 12c0-2-1-4-3-6', pot: 'M5 10h14v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4zM3 10h18M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2', wrap: 'M5 17L17 5l2 2L7 19zM9 9l6 6' };
    const r = (name, k, p, meta, icon, versions) => ({ name, k, p, meta, icon, versions });
    const pc = { paneer: 10, soya: 8, pulses: 4, tofu: 3, tempeh: 0, whey: 0 };
    return {
      themeClass: this.props.theme === 'dark' ? 'dark' : '',
      meals: ['All','Breakfast','Lunch','Snack','Dinner'].map((l, i) => ({ label: l, bar: i === 4 ? 'var(--brand)' : 'transparent', color: i === 4 ? 'var(--text)' : 'var(--text2)', weight: i === 4 ? 700 : 500 })),
      proteins: [['Paneer','paneer'],['Soya','soya'],['Pulses','pulses'],['Tofu','tofu'],['Tempeh','tempeh'],['Whey','whey']].map(([label, k]) => ({ label, k, n: pc[k], on: k === 'paneer' || k === 'soya', off: pc[k] === 0, op: pc[k] === 0 ? 0.45 : 1 })),
      types: [['Curry', 6], ['Kebab / tikki', 4], ['Salad / bowl', 3], ['Rice', 2], ['Wrap / roll', 2]].map(([label, n]) => ({ label, n })),
      quick: [['Quick', false], ['My list', false], ['Global', false], ['Air fryer', false]].map(([label, on]) => ({ label, bg: on ? 'var(--inv)' : 'var(--muted)', fg: on ? 'var(--on-inv)' : 'var(--text)' })),
      recipes: [
        r('Soya Tikka Salad', 'soya', '45', 'Soya · 420 kcal', I.salad),
        r('Soya Tikka Masala', 'soya', '41', 'Soya · ~330 kcal', I.pot),
        r('Soya Chukauni', 'soya', '40', 'Soya · 494 kcal', I.pot),
        r('Protein pasta', 'paneer', '35+', 'Paneer · ~570 kcal', I.noodle, '2 versions'),
        r('Shahi Paneer', 'paneer', '31', 'Paneer · 380 kcal', I.pot),
        r('Soya kebab', 'soya', '30+', 'Soya · ~470 kcal', I.skew, '6 versions'),
        r('Hariyali Soya Rice', 'soya', '25', 'Soya · 505 kcal', I.bowl),
        r('Paneer Kati Roll', 'paneer', '17', 'Paneer · 217 kcal', I.wrap)
      ]
    };
  }
}
</script>
</body>
</html>
