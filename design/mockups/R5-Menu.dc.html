<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#17734A}a:hover{color:#0F5535}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #3B4540; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; justify-content: flex-end">
<div style="background: #FFFFFF; color: #14201A; border-radius: 24px 24px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 6px">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #CFD8D3; margin-bottom: 8px"></div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="font-size: 12px; font-weight: 700; color: #5B6B62; letter-spacing: 0.4px; margin-top: 10px">{{g.title}}</div>
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="2">
<a href="{{i.href}}" style="display: flex; align-items: center; gap: 14px; min-height: 56px; text-decoration: none; color: #14201A; border-bottom: 1px solid #EEF2EF">
<span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #E3F1E9; color: #17734A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{i.icon}}"/></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{i.label}}</span><span style="font-size: 12px; color: #5B6B62">{{i.sub}}</span></span>
</a>
</sc-for>
</sc-for>
<div style="font-size: 12px; font-weight: 700; color: #5B6B62; letter-spacing: 0.4px; margin-top: 14px">APPEARANCE</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; border-radius: 12px; background: #F2F5F3; margin-top: 4px">
<button style="height: 40px; border: none; border-radius: 9px; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #5B6B62">Light</button>
<button style="height: 40px; border: none; border-radius: 9px; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #5B6B62">Dark</button>
<button style="height: 40px; border: none; border-radius: 9px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #14201A; box-shadow: 0 1px 2px rgba(20,32,26,0.12)">Auto</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      groups: [
        { title: 'CATALOG', items: [
          { label: 'Add recipes', sub: 'Paste JSON from an AI chat', href: 'R5-Add.dc.html', icon: 'M12 5v14M5 12h14' },
          { label: 'Export catalog', sub: 'For AI questions or to share', href: 'R5-Export.dc.html', icon: 'M12 3v12M7 10l5 5 5-5M5 21h14' }
        ] },
        { title: 'MY DATA ON THIS DEVICE', items: [
          { label: 'Back up my data', sub: 'Notes, bookmarks, Keep / Not for me', href: '#', icon: 'M12 3v12M7 10l5 5 5-5M5 21h14' },
          { label: 'Restore from backup', sub: 'Load a backup file', href: '#', icon: 'M12 21V9M7 14l5-5 5 5M5 3h14' }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
