<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My recipes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
.pp{--bg:#FFFFFF;--surface:#F6F8F7;--card:#FFFFFF;--muted:#F2F5F3;--line:#E1E8E4;--line2:#CFD8D3;--text:#14201A;--text2:#5B6B62;--brand:#17734A;--on-brand:#FFFFFF;--inv:#14201A;--on-inv:#FFFFFF;--scrim:rgba(20,32,26,0.55);--soya-bg:#E3F1E9;--soya:#17734A;--paneer-bg:#FDF1DC;--paneer:#8A5208;--pulses-bg:#FDE7DF;--pulses:#A63D1A;--tofu-bg:#E6EEF8;--tofu:#24508F;--tempeh-bg:#EFE8F8;--tempeh:#5E3592;--whey-bg:#DFF3F1;--whey:#0D6B64;--warn-bg:#FDF1DC;--warn:#8A5208;--err-bg:#FDE7DF;--err:#A63D1A;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif}
.pp.dark{--bg:#111614;--surface:#0C100E;--card:#18201C;--muted:#1F2824;--line:#26312C;--line2:#3A4741;--text:#EEF3F0;--text2:#A3B2AA;--brand:#4CC487;--on-brand:#0C100E;--inv:#EEF3F0;--on-inv:#111614;--scrim:rgba(0,0,0,0.6);--soya-bg:#17301F;--soya:#7BD3A0;--paneer-bg:#33270F;--paneer:#F2C26B;--pulses-bg:#3A1E14;--pulses:#F29A78;--tofu-bg:#172438;--tofu:#8DB4EA;--tempeh-bg:#271C38;--tempeh:#C3A3EE;--whey-bg:#10302D;--whey:#6FD3C8;--warn-bg:#33270F;--warn:#F2C26B;--err-bg:#3A1E14;--err:#F29A78}
.num{font-family:'Space Grotesk',sans-serif}
</style>
</helmet>
<div class="pp {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 0">
<div style="display: flex; align-items: center; gap: 12px">
<a href="R5-Menu.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: var(--muted); color: var(--text); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="font-size: 22px; font-weight: 800">My recipes</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; border-radius: 12px; background: var(--muted)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button style="height: 40px; border: none; border-radius: 9px; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 14px; font-weight: {{t.w}}">{{t.label}} <span style="font-weight: 500; opacity: 0.7">{{t.n}}</span></button></sc-for>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line)">
<a href="F2-Recipe.dc.html" style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; text-decoration: none; color: var(--text)">
<div style="width: 56px; height: 56px; flex: none; border-radius: 14px; background: var(--{{r.k}}-bg); color: var(--{{r.k}}); display: flex; flex-direction: column; align-items: center; justify-content: center"><span class="num" style="font-size: 20px; font-weight: 700; line-height: 1">{{r.p}}</span><span style="font-size: 9px; font-weight: 700">g protein</span></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><div style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</div><div style="font-size: 12px; color: var(--text2)">{{r.meta}}</div></div>
</a>
<button aria-label="Remove from My list" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: none; background: var(--muted); color: var(--brand); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 8px; align-items: flex-start; padding: 12px; border-radius: 14px; background: var(--muted); font-size: 12px; color: var(--text2); line-height: 1.5">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
<span>Likes, dislikes, My list and notes are saved on this device only. Other people using this site have their own. To move yours, use <b style="color: var(--text)">Back up</b> in the menu.</span>
</div>
<div style="font-size: 12px; color: var(--text2); text-align: center">Disliked tab: each row has <b style="color: var(--text)">Undo</b> instead of the bookmark.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = (label, n, on) => ({ label, n, bg: on ? 'var(--card)' : 'transparent', fg: on ? 'var(--text)' : 'var(--text2)', w: on ? 700 : 600 });
    return {
      themeClass: this.props.theme === 'dark' ? 'dark' : '',
      tabs: [tab('Liked', 5, false), tab('My list', 4, true), tab('Disliked', 2, false)],
      rows: [
        { name: 'Moong Dal Veg Pizza', meta: 'Pulses + paneer · 710 kcal', p: '49', k: 'pulses' },
        { name: 'Tempeh avocado toast', meta: 'Tempeh · 435 kcal', p: '28', k: 'tempeh' },
        { name: 'Corn & cheese soya kebab', meta: 'Soya · 470 kcal', p: '31', k: 'soya' },
        { name: 'Korean tofu wrap', meta: 'Tofu · Global · 420 kcal', p: '26', k: 'tofu' }
      ]
    };
  }
}
</script>
</body>
</html>
