<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#17734A}a:hover{color:#0F5535}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #FFFFFF; color: #14201A; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 20px 16px 0">
<div style="display: flex; gap: 8px; align-items: center">
<a href="R4-Home.dc.html" aria-label="Back" style="width: 44px; height: 46px; flex: none; color: #14201A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<label style="flex: 1; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 14px; border-radius: 14px; background: #F2F5F3; border: 1.5px solid #17734A; font-size: 15px">
<input value="bread" aria-label="Search" style="border: none; background: transparent; font: inherit; color: #14201A; flex: 1; min-width: 0; outline: none">
<button aria-label="Clear search" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #DCE4DF; color: #14201A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</label>
</div>
<div style="font-size: 13px; font-weight: 600; color: #5B6B62"><span style="color: #14201A; font-weight: 800">6 dishes</span> use bread · 1 name match</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{recipes}}" as="r" hint-placeholder-count="6">
<a href="R3-Recipe.dc.html" style="text-decoration: none; color: #14201A; height: 156px; border-radius: 18px; background: {{r.bg}}; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: flex-start; color: {{r.fg}}">
<div style="display: flex; align-items: baseline; gap: 3px"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; line-height: 1; letter-spacing: -1px">{{r.p}}</span><span style="font-size: 12px; font-weight: 700">g</span></div>
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18L12 5l8 13zM7 14h10"/></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 14px; font-weight: 800; line-height: 1.2">{{r.name}}</div>
<div style="font-size: 11px; font-weight: 600; color: {{r.fg}}">{{r.meta}}</div>
<span style="align-self: flex-start; margin-top: 2px; font-size: 10px; font-weight: 700; background: #FFFFFF; color: #14201A; border-radius: 6px; padding: 2px 7px">uses {{r.match}}</span>
</div>
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = { soya: ['#E3F1E9', '#17734A'], paneer: ['#FDF1DC', '#8A5208'], tempeh: ['#EFE8F8', '#5E3592'] };
    const r = (name, key, p, meta, match) => ({ name, p, meta, match, bg: P[key][0], fg: P[key][1] });
    return {
      recipes: [
        r('Dahi Tadka Sandwich', 'paneer', '40', 'Paneer · 560 kcal', 'whole-wheat bread'),
        r('Breakfast sandwich', 'paneer', '35', 'Paneer · 465 kcal', 'protein bread'),
        r('Bread pakoda sandwich', 'paneer', '30', 'Paneer · ~480 kcal', 'bread'),
        r('Tempeh avocado toast', 'tempeh', '28', 'Tempeh · 435 kcal', 'protein bread'),
        r('Soyabean Toast', 'soya', '25', 'Soya · 465 kcal', 'whole-wheat bread'),
        r('Creamy Paneer Sandwich', 'paneer', '16', 'Paneer · 260 kcal', 'multigrain bread')
      ]
    };
  }
}
</script>
</body>
</html>
