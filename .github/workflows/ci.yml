name: CI

# PR → check. Push to main → check, then deploy to GitHub Pages.
# A recipe that fails validation fails `check`, so `deploy` never runs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate recipes
        run: npm run validate
      - name: Validate fixtures
        run: npm run validate:fixtures
      - name: Generated types are up to date
        run: npm run check:types
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
      - name: Install Playwright browser
        # This step once hung for 50+ minutes (PR 31); fail fast instead of blocking CI for hours.
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: e2e (overflow check, light + dark)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: test-results/
          retention-days: 14

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
